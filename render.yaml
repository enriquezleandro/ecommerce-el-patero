services:
  - type: web
    name: el-patero-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npx prisma migrate deploy && node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
